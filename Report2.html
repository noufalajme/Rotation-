<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Development</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #004d26;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: white;
            color: #004d26;
            padding: 15px 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .logo {
            width: 50px;
            margin-right: 15px;
        }

        .container {
            margin-top: 30px;
            padding: 0 20px;
        }

        .section {
            text-align: right;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 900px;
            direction: rtl;
        }

        .section h2 {
            color: #ffcc00;
            margin-bottom: 10px;
        }

        .section a {
            color: #ffcc00;
            font-weight: bold;
            text-decoration: underline;
            font-size: 18px;
        }

        .section a:hover {
            color: #ffff66;
        }

        .back {
            background: red;
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 10px;
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .back:hover {
            background: darkred;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="LOGO.PNG" alt="Logo" class="logo">
        <div>Ministry of Investment</div>
    </div>

    <div class="container">
        
        <div class="section">
            <h2>تقرير قسم التطوير</h2>
            <p>
                يمكنك الاطلاع على تقرير قسم التطوير من خلال الرابط التالي:
                <br><br>
                <a href="https://drive.google.com/drive/folders/1gOU0wbAZldueJpgMmHya9GVGRjCAxpES?usp=sharing" target="_blank">
                    اضغط هنا لعرض التقرير
                </a>
            </p>
        </div>

        <a href="Infra.html" class="back">العودة للصفحة الرئيسية</a>
    </div>

</body>
</html>
